<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripulanteFlow Renfe Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .day-cell { aspect-ratio: 1/1.1; display: flex; flex-direction: column; padding: 6px; border-radius: 1rem; cursor: pointer; transition: all 0.2s; border: 2px solid transparent; position: relative; background: white; overflow: hidden; }
        .day-cell:hover { border-color: #4f46e5; transform: scale(1.02); }
        .day-today { background: #eef2ff; border-color: #4f46e5; }
        .day-has-shift { background: #f1f5f9; }
        .day-planner-selected { background: #4f46e5 !important; color: white !important; }
        .tab-active { color: #4f46e5 !important; border-bottom: 2px solid #4f46e5; }
        
        #planner-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .notification { position: fixed; top: 20px; right: 20px; padding: 16px 24px; background: #1e293b; color: white; border-radius: 1rem; transform: translateX(150%); transition: transform 0.3s; z-index: 3000; }
        .notification.show { transform: translateX(0); }
    </style>
</head>
<body class="pb-24">

    <div id="notification" class="notification font-bold text-sm shadow-2xl"></div>

    <!-- Modal Planificador Mes Siguiente -->
    <div id="planner-modal">
        <div class="bg-white rounded-[2.5rem] p-8 w-full max-w-md mx-4 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h3 class="text-xl font-black" id="planner-month-name">Mes Siguiente</h3>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest" id="planner-instruction">Selecciona días libres</p>
                </div>
                <button onclick="closePlanner()" class="p-2 bg-slate-100 rounded-full hover:bg-red-50 text-red-500"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="2.5"></path></svg></button>
            </div>
            <div id="planner-calendar-grid" class="calendar-grid"></div>
            <div class="mt-6 flex gap-2">
                <button onclick="closePlanner()" class="flex-1 py-4 bg-slate-100 font-black rounded-2xl text-xs uppercase">Cancelar</button>
                <button onclick="confirmPlanner()" class="flex-1 py-4 bg-indigo-600 text-white font-black rounded-2xl text-xs uppercase shadow-lg">Confirmar Selección</button>
            </div>
        </div>
    </div>

    <!-- Navegación -->
    <nav class="sticky top-0 z-50 glass border-b border-slate-200/50 px-6 py-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black tracking-tight text-slate-800">Renfe<span class="text-indigo-600">Flow</span> Pro</h1>
            <div class="flex gap-6">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="text-xs font-black uppercase tracking-tighter transition-all tab-active pb-1">Panel</button>
                <button onclick="switchTab('new')" id="nav-new" class="text-xs font-black text-slate-400 uppercase tracking-tighter transition-all pb-1">Nuevo Tren</button>
                <button onclick="switchTab('history')" id="nav-history" class="text-xs font-black text-slate-400 uppercase tracking-tighter transition-all pb-1">Listado</button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 mt-8">
        <section id="tab-dashboard" class="space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Ingresos Mes</p>
                    <div class="text-2xl font-black text-slate-800"><span id="stat-money">0</span>€</div>
                </div>
                <div class="bg-indigo-600 p-6 rounded-[2rem] shadow-xl text-white flex justify-between items-center">
                    <div>
                        <p class="text-[10px] font-black text-indigo-200 uppercase tracking-widest mb-1">Libres Acumulados</p>
                        <div class="text-2xl font-black" id="stat-accumulated">0</div>
                    </div>
                    <button onclick="openPlanner()" class="p-3 bg-white/20 hover:bg-white/30 rounded-xl transition-all" title="Planificar Mes Siguiente">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-width="2.5"></path></svg>
                    </button>
                </div>
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Pernoctas</p>
                    <div class="text-2xl font-black text-emerald-600" id="stat-pernoctas">0</div>
                </div>
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Trenes Realizados</p>
                    <div class="text-2xl font-black text-orange-600" id="stat-trains">0</div>
                </div>
            </div>

            <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
                <div class="p-6 flex justify-between items-center bg-slate-50/50 border-b">
                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-indigo-600 hover:text-white rounded-lg transition-all"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-width="3"></path></svg></button>
                    <h2 id="calendar-month-year" class="font-black text-lg capitalize text-slate-800"></h2>
                    <button onclick="changeMonth(1)" class="p-2 hover:bg-indigo-600 hover:text-white rounded-lg transition-all"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="3"></path></svg></button>
                </div>
                <div class="p-6">
                    <div class="grid grid-cols-7 text-center mb-4 text-[10px] font-black text-slate-400 uppercase">
                        <div>Lu</div><div>Ma</div><div>Mi</div><div>Ju</div><div>Vi</div><div>Sá</div><div>Do</div>
                    </div>
                    <div id="calendar-grid" class="calendar-grid"></div>
                </div>
            </div>
        </section>

        <section id="tab-new" class="hidden max-w-2xl mx-auto">
            <div class="bg-white p-10 rounded-[3rem] shadow-2xl border border-slate-100">
                <h2 class="text-3xl font-black text-slate-800 mb-6">Nuevo Servicio</h2>
                <form id="shift-form" onsubmit="saveShift(event)" class="space-y-6">
                    <input type="hidden" id="edit-id">
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-[10px] font-black uppercase text-slate-400 block mb-2 ml-2">Fecha</label>
                            <input type="date" id="form-date" required class="w-full p-4 bg-slate-50 border-2 border-transparent outline-none font-bold rounded-2xl">
                        </div>
                        <div>
                            <label class="text-[10px] font-black uppercase text-slate-400 block mb-2 ml-2">Mi Base Principal</label>
                            <select id="form-base" onchange="calculateJornada()" class="w-full p-4 bg-slate-50 rounded-2xl font-bold">
                                <option value="MADRID - ATOCHA">MADRID - ATOCHA</option>
                                <option value="BARCELONA - SANTS">BARCELONA - SANTS</option>
                                <option value="VALENCIA - J. SOROLLA">VALENCIA - J. SOROLLA</option>
                                <option value="SEVILLA - SANTA JUSTA">SEVILLA - SANTA JUSTA</option>
                                <option value="MALAGA - M. ZAMBRANO">MÁLAGA - M. ZAMBRANO</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-[10px] font-black uppercase text-slate-400 block mb-2 ml-2">Origen</label>
                            <select id="form-origin" class="w-full p-4 bg-slate-50 rounded-2xl font-bold"></select>
                        </div>
                        <div>
                            <label class="text-[10px] font-black uppercase text-slate-400 block mb-2 ml-2">Destino</label>
                            <select id="form-destination" onchange="calculateJornada()" class="w-full p-4 bg-slate-50 rounded-2xl font-bold"></select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-[10px] font-black uppercase text-slate-400 block mb-2 ml-2">Salida Tren</label>
                            <input type="time" id="time-train-departure" onchange="calculateJornada()" class="w-full p-4 bg-slate-50 font-bold rounded-2xl">
                        </div>
                        <div>
                            <label class="text-[10px] font-black uppercase text-slate-400 block mb-2 ml-2">Llegada Tren</label>
                            <input type="time" id="time-train-arrival" onchange="calculateJornada()" class="w-full p-4 bg-slate-50 font-bold rounded-2xl">
                        </div>
                    </div>

                    <div class="p-6 bg-indigo-50 rounded-3xl grid grid-cols-2 gap-4 border border-indigo-100">
                        <div>
                            <p class="text-[9px] font-black uppercase text-indigo-400 mb-1">Entrada Jornada (+1H)</p>
                            <div id="display-entry" class="text-xl font-black text-indigo-700">--:--</div>
                        </div>
                        <div>
                            <p class="text-[9px] font-black uppercase text-indigo-400 mb-1">Salida Jornada (Base+20/Fuera+15)</p>
                            <div id="display-exit" class="text-xl font-black text-indigo-700">--:--</div>
                        </div>
                    </div>

                    <div class="p-6 bg-slate-50 rounded-3xl space-y-4">
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" id="form-descanso" class="w-5 h-5 rounded text-indigo-600">
                            <span class="text-xs font-black uppercase text-slate-600">He trabajado mi descanso (120€)</span>
                        </label>
                        <div id="compensatory-btn-container" class="hidden">
                            <button type="button" onclick="openPlanner(2)" class="w-full py-3 bg-white border-2 border-indigo-200 text-indigo-600 rounded-xl text-[10px] font-black uppercase hover:bg-indigo-50 transition-all">
                                Elegir 2 días compensatorios del mes siguiente →
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 text-white font-black py-5 rounded-2xl shadow-xl hover:bg-indigo-700 transition-all uppercase text-sm tracking-widest">Guardar Registro</button>
                </form>
            </div>
        </section>

        <section id="tab-history" class="hidden">
            <h2 class="text-3xl font-black text-slate-800 mb-6">Historial</h2>
            <div class="bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase">
                        <tr>
                            <th class="px-8 py-4">Fecha</th>
                            <th class="px-8 py-4">Ruta / Jornada</th>
                            <th class="px-8 py-4 text-right">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const STATIONS = [
            "MADRID - ATOCHA", "MADRID - CHAMARTIN", "BARCELONA - SANTS", "VALENCIA - J. SOROLLA", 
            "SEVILLA - SANTA JUSTA", "MALAGA - M. ZAMBRANO", "ALICANTE - TERMINAL", "ZARAGOZA - DELICIAS", 
            "CORDOBA", "VALLADOLID - C. GRANDE", "LEON", "MURCIA - DEL CARMEN", "CASTELLON", 
            "TARRAGONA - CAMP", "GIRONA", "FIGUERES - VILAFANT", "ALBACETE - LOS LLANOS", 
            "CUENCA - F. ZOBEL", "CIUDAD REAL", "PUERTOLLANO", "TOLEDO", "SEGOVIA - GUIOMAR", 
            "ZAMORA", "OURENSE", "SANTIAGO DE C.", "A CORUÑA", "VIGO - URZAIZ", "PONTEVEDRA", 
            "OVIEDO", "GIJON", "SANTANDER", "BILBAO - ABANDO", "SAN SEBASTIAN", "PAMPLONA", 
            "LOGROÑO", "HUESCA", "LLEIDA - PIRINEUS", "GRANADA", "CADIZ", "ALGECIRAS", 
            "HUELVA - TERMINO", "BADAJOZ", "CACERES"
        ].sort();

        let shifts = JSON.parse(localStorage.getItem('renfe_flow_v2')) || [];
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let plannerSelectedDays = [];
        let plannerLimit = null;

        // CALCULO DE JORNADA
        function calculateJornada() {
            const depTime = document.getElementById('time-train-departure').value;
            const arrTime = document.getElementById('time-train-arrival').value;
            const base = document.getElementById('form-base').value;
            const dest = document.getElementById('form-destination').value;

            if (depTime) {
                const [h, m] = depTime.split(':').map(Number);
                const entryH = (h + 1) % 24;
                document.getElementById('display-entry').innerText = `${String(entryH).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            }

            if (arrTime) {
                const [h, m] = arrTime.split(':').map(Number);
                const isBase = dest === base;
                const extra = isBase ? 20 : 15;
                let totalMin = m + extra;
                let finalH = h;
                if (totalMin >= 60) { finalH = (h + 1) % 24; totalMin -= 60; }
                document.getElementById('display-exit').innerText = `${String(finalH).padStart(2, '0')}:${String(totalMin).padStart(2, '0')}`;
            }
        }

        // GESTIÓN DE TABS
        function switchTab(tab) {
            document.querySelectorAll('main section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active', 'text-slate-400'));
            document.getElementById(`nav-${tab}`).classList.add('tab-active');
            
            if (tab === 'new') {
                document.getElementById('shift-form').reset();
                document.getElementById('display-entry').innerText = "--:--";
                document.getElementById('display-exit').innerText = "--:--";
            }
            updateUI();
        }

        // PLANIFICADOR
        function openPlanner(limit = null) {
            plannerLimit = limit;
            plannerSelectedDays = [];
            const modal = document.getElementById('planner-modal');
            const nextMonth = (currentMonth + 1) % 12;
            const nextYear = currentMonth === 11 ? currentYear + 1 : currentYear;
            
            document.getElementById('planner-month-name').innerText = new Intl.DateTimeFormat('es-ES', { month: 'long', year: 'numeric' }).format(new Date(nextYear, nextMonth));
            document.getElementById('planner-instruction').innerText = limit ? `Elige exactamente ${limit} días para compensar` : "Selecciona días de disfrute";
            
            renderPlannerCalendar(nextMonth, nextYear);
            modal.style.display = 'flex';
        }

        function closePlanner() {
            document.getElementById('planner-modal').style.display = 'none';
        }

        function renderPlannerCalendar(month, year) {
            const grid = document.getElementById('planner-calendar-grid');
            grid.innerHTML = '';
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = (new Date(year, month, 1).getDay() + 6) % 7;

            for(let i=0; i<firstDay; i++) grid.appendChild(document.createElement('div'));

            for(let d=1; d<=daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const el = document.createElement('div');
                el.className = 'day-cell border-slate-100 items-center justify-center font-bold text-sm';
                el.innerText = d;
                el.onclick = () => {
                    if (el.classList.contains('day-planner-selected')) {
                        el.classList.remove('day-planner-selected');
                        plannerSelectedDays = plannerSelectedDays.filter(day => day !== dateStr);
                    } else {
                        if (plannerLimit && plannerSelectedDays.length >= plannerLimit) return;
                        el.classList.add('day-planner-selected');
                        plannerSelectedDays.push(dateStr);
                        
                        // AUTO-CIERRE SI LLEGA AL LIMITE
                        if (plannerLimit && plannerSelectedDays.length === plannerLimit) {
                            setTimeout(() => confirmPlanner(), 400);
                        }
                    }
                };
                grid.appendChild(el);
            }
        }

        function confirmPlanner() {
            plannerSelectedDays.forEach(date => {
                shifts.push({
                    id: Date.now() + Math.random(),
                    date: date,
                    type: 'libres',
                    origin: 'LIBRE',
                    destination: 'DISFRUTE',
                    isDescanso: false
                });
            });
            localStorage.setItem('renfe_flow_v2', JSON.stringify(shifts));
            showNotification(`Se han registrado ${plannerSelectedDays.length} días de disfrute.`);
            closePlanner();
            updateUI();
        }

        // RENDERIZADO CALENDARIO PRINCIPAL (CON INFO)
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const firstDay = (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7;

            document.getElementById('calendar-month-year').innerText = 
                new Intl.DateTimeFormat('es-ES', { month: 'long', year: 'numeric' }).format(new Date(currentYear, currentMonth));

            for(let i=0; i<firstDay; i++) grid.appendChild(document.createElement('div'));

            for(let d=1; d<=daysInMonth; d++) {
                const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dayShifts = shifts.filter(s => s.date === dateStr);
                const isToday = new Date().toISOString().split('T')[0] === dateStr;

                const el = document.createElement('div');
                el.className = `day-cell ${isToday ? 'day-today' : ''} ${dayShifts.length > 0 ? 'day-has-shift shadow-sm' : ''}`;
                
                let content = `<span class="text-[10px] font-black ${isToday ? 'text-indigo-600' : 'text-slate-400'}">${d}</span>`;
                
                dayShifts.forEach(s => {
                    const isLibre = s.type === 'libres';
                    content += `
                        <div class="mt-1 px-1 py-0.5 rounded text-[8px] font-black truncate ${isLibre ? 'bg-indigo-100 text-indigo-700' : 'bg-emerald-100 text-emerald-700'}">
                            ${s.origin.split(' ')[0]} ${isLibre ? '' : '→ ' + s.destination.split(' ')[0]}
                        </div>
                    `;
                });

                el.innerHTML = content;
                el.onclick = () => {
                    document.getElementById('form-date').value = dateStr;
                    switchTab('new');
                };
                grid.appendChild(el);
            }
        }

        function saveShift(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const shiftData = {
                id: id ? parseFloat(id) : Date.now(),
                date: document.getElementById('form-date').value,
                base: document.getElementById('form-base').value,
                origin: document.getElementById('form-origin').value,
                destination: document.getElementById('form-destination').value,
                trainDeparture: document.getElementById('time-train-departure').value,
                trainArrival: document.getElementById('time-train-arrival').value,
                entry: document.getElementById('display-entry').innerText,
                exit: document.getElementById('display-exit').innerText,
                isDescanso: document.getElementById('form-descanso').checked,
                type: 'tren'
            };

            if(id) shifts = shifts.filter(s => s.id !== shiftData.id);
            shifts.push(shiftData);
            localStorage.setItem('renfe_flow_v2', JSON.stringify(shifts));
            showNotification("Registro guardado con éxito");
            switchTab('dashboard');
        }

        function updateUI() {
            renderCalendar();
            renderStats();
            renderHistory();
        }

        function renderStats() {
            const currentShifts = shifts.filter(s => s.date.startsWith(`${currentYear}-${String(currentMonth+1).padStart(2,'0')}`));
            // Solo sumamos 120€ si el campo isDescanso es verdadero. Los trenes normales ya no suman 60€.
            const money = currentShifts.reduce((acc, s) => acc + (s.isDescanso ? 120 : 0), 0);
            
            const pernoctas = currentShifts.filter(s => s.type === 'tren' && s.destination !== s.base).length;
            
            // Días acumulados: cada descanso trabajado genera 2 días, menos los días ya disfrutados
            const accumulated = shifts.filter(s => s.isDescanso).length * 2 - shifts.filter(s => s.destination === 'DISFRUTE').length;

            document.getElementById('stat-money').innerText = money;
            document.getElementById('stat-pernoctas').innerText = pernoctas;
            document.getElementById('stat-trains').innerText = currentShifts.filter(s => s.type === 'tren').length;
            document.getElementById('stat-accumulated').innerText = Math.max(0, accumulated);
        }

        function renderHistory() {
            const tbody = document.getElementById('history-tbody');
            tbody.innerHTML = '';
            [...shifts].sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(s => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-8 py-4 font-bold text-sm">${s.date}</td>
                    <td class="px-8 py-4">
                        <div class="text-xs font-black uppercase text-slate-700">${s.origin} → ${s.destination}</div>
                        <div class="text-[9px] text-indigo-500 font-bold">JORNADA: ${s.entry || '--:--'} - ${s.exit || '--:--'}</div>
                    </td>
                    <td class="px-8 py-4 text-right">
                        <button onclick="deleteShift(${s.id})" class="text-red-400 hover:text-red-600 font-black text-[10px]">BORRAR</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteShift(id) {
            shifts = shifts.filter(s => s.id !== id);
            localStorage.setItem('renfe_flow_v2', JSON.stringify(shifts));
            updateUI();
        }

        function showNotification(msg) {
            const n = document.getElementById('notification');
            n.innerText = msg; n.classList.add('show');
            setTimeout(() => n.classList.remove('show'), 3000);
        }

        function changeMonth(dir) {
            currentMonth += dir;
            if(currentMonth < 0) { currentMonth = 11; currentYear--; }
            if(currentMonth > 11) { currentMonth = 0; currentYear++; }
            updateUI();
        }

        // Checkbox Listener para mostrar botón de compensatorios
        document.getElementById('form-descanso').addEventListener('change', (e) => {
            document.getElementById('compensatory-btn-container').classList.toggle('hidden', !e.target.checked);
        });

        window.onload = () => {
            const selects = ['form-origin', 'form-destination'];
            selects.forEach(id => {
                const s = document.getElementById(id);
                STATIONS.forEach(st => {
                    const opt = document.createElement('option');
                    opt.value = st; opt.innerText = st;
                    s.appendChild(opt);
                });
            });
            updateUI();
        };
    </script>
</body>
</html>
